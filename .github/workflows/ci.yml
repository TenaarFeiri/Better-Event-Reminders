name: Better Event Reminders CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run checks
        run: LUA_BIN=lua5.4 LUAC_BIN=luac5.4 ./tools/test.sh
